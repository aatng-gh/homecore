name: Promote Homecore

on:
  workflow_dispatch:
    inputs:
      digest:
        description: Candidate digest, with or without the sha256 prefix
        required: true
        type: string

concurrency:
  group: homecore-promotion
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  promote:
    name: Promote digest to stable
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: homecore-production
    permissions:
      contents: read
      packages: write
    steps:
      - name: Normalize candidate digest
        id: candidate
        env:
          INPUT_DIGEST: ${{ inputs.digest }}
        run: |
          set -euo pipefail
          digest=${INPUT_DIGEST#sha256:}
          [[ ${digest} =~ ^[0-9a-f]{64}$ ]] || {
            echo "digest must be 64 lowercase hexadecimal characters" >&2
            exit 1
          }
          echo "digest=sha256:${digest}" >>"${GITHUB_OUTPUT}"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify candidate digest
        env:
          DIGEST: ${{ steps.candidate.outputs.digest }}
        run: |
          set -euo pipefail
          image="${REGISTRY}/${IMAGE_NAME}"
          actual=$(docker buildx imagetools inspect "${image}:candidate" |
            awk '$1 == "Digest:" {print $2; exit}')
          [[ ${actual} == "${DIGEST}" ]] || {
            echo "candidate resolves to ${actual:-nothing}, not ${DIGEST}" >&2
            exit 1
          }

      - name: Promote exact candidate
        env:
          DIGEST: ${{ steps.candidate.outputs.digest }}
        run: |
          set -euo pipefail
          image="${REGISTRY}/${IMAGE_NAME}"
          docker buildx imagetools create --prefer-index=false \
            --tag "${image}:stable" "${image}@${DIGEST}"
          actual=$(docker buildx imagetools inspect "${image}:stable" |
            awk '$1 == "Digest:" {print $2; exit}')
          [[ ${actual} == "${DIGEST}" ]] || {
            echo "stable digest differs from the selected candidate" >&2
            exit 1
          }

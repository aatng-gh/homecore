name: Promote Homecore

on:
  workflow_dispatch:
    inputs:
      digest:
        description: Candidate manifest digest (sha256:...)
        required: true
        type: string
      revision:
        description: Publishing commit (full 40-character SHA)
        required: true
        type: string

concurrency:
  group: homecore-promotion
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  promote:
    name: Promote digest to stable
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: homecore-production
    permissions:
      contents: read
      packages: write
    steps:
      - name: Validate inputs
        env:
          DIGEST: ${{ inputs.digest }}
          REVISION: ${{ inputs.revision }}
        run: |
          [[ ${DIGEST} =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "digest must have the form sha256:<64 lowercase hex characters>" >&2
            exit 1
          }
          [[ ${REVISION} =~ ^[0-9a-f]{40}$ ]] || {
            echo "revision must be a full 40-character lowercase commit SHA" >&2
            exit 1
          }

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify candidate revision
        env:
          DIGEST: ${{ inputs.digest }}
          REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          image="${REGISTRY}/${IMAGE_NAME}"
          actual=$(docker buildx imagetools inspect "${image}:sha-${REVISION}" |
            awk '$1 == "Digest:" {print $2; exit}')
          [[ ${actual} == "${DIGEST}" ]] || {
            echo "sha-${REVISION} resolves to ${actual:-nothing}, not ${DIGEST}" >&2
            exit 1
          }

      - name: Promote exact candidate
        env:
          DIGEST: ${{ inputs.digest }}
        run: |
          set -euo pipefail
          image="${REGISTRY}/${IMAGE_NAME}"
          docker buildx imagetools create --prefer-index=false \
            --tag "${image}:stable" "${image}@${DIGEST}"
          actual=$(docker buildx imagetools inspect "${image}:stable" |
            awk '$1 == "Digest:" {print $2; exit}')
          [[ ${actual} == "${DIGEST}" ]] || {
            echo "stable digest differs from the selected candidate" >&2
            exit 1
          }

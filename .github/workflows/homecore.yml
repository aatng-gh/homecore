name: Homecore image

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: homecore-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate source
        run: ./scripts/check.sh

  build:
    name: Build pull request image
    if: github.event_name == 'pull_request'
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Read pinned build inputs
        id: inputs
        shell: bash
        run: |
          {
            echo 'args<<EOF'
            ./scripts/build-args.sh
            echo EOF
          } >>"${GITHUB_OUTPUT}"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build Homecore
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64
          push: false
          build-args: ${{ steps.inputs.outputs.args }}
          cache-from: type=gha,scope=homecore-amd64
          cache-to: type=gha,mode=max,scope=homecore-amd64

  publish:
    name: Publish candidate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Read pinned build inputs
        id: inputs
        shell: bash
        run: |
          {
            echo 'args<<EOF'
            ./scripts/build-args.sh
            echo EOF
          } >>"${GITHUB_OUTPUT}"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Homecore
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:candidate
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.title=Homecore
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=sha-${{ github.sha }}
          build-args: ${{ steps.inputs.outputs.args }}
          cache-from: type=gha,scope=homecore-amd64
          cache-to: type=gha,mode=max,scope=homecore-amd64
          provenance: mode=max
          sbom: true

      - name: Record candidate
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          REVISION: ${{ github.sha }}
        run: |
          {
            echo "### Homecore candidate"
            echo '```text'
            echo "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"
            echo "revision=${REVISION}"
            echo '```'
          } >>"${GITHUB_STEP_SUMMARY}"
